<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Web Tools</title>
    <link rel="stylesheet" href="./css/styles.css" />
    <style>
        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: calc(100% + 6px);
            min-width: 190px;
            z-index: 50;
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding: 6px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
        }

        .dropdown-menu[hidden] {
            display: none;
        }

        .dropdown-menu button {
            text-align: left;
            background: transparent;
            border: 0;
            color: inherit;
            padding: 9px 10px;
            border-radius: 8px;
            cursor: pointer;
            font: inherit;
        }

        .dropdown-menu button:hover,
        .dropdown-menu button:focus-visible {
            background: var(--panel2, rgba(255, 255, 255, .08));
            outline: none;
        }
    </style>
</head>

<body>
    <header class="top">
        <h1>🧰 Web Tools</h1>
        <nav>
            <a href="./index.html" class="active"><span class="nav-icon">🔍</span>Home</a>
            <a href="./add.html"><span class="nav-icon">➕</span>Add</a>
            <div class="dropdown" id="exportMenu">
                <button class="nav" id="exportBtn" aria-haspopup="menu" aria-expanded="false"><span
                        class="nav-icon">📤</span>Export ▾</button>
                <div class="dropdown-menu" id="exportList" role="menu" hidden>
                    <button role="menuitem" data-export="download">⬇️ Download (JSON)</button>
                    <button role="menuitem" data-export="qr">📱 QR</button>
                </div>
            </div>
            <button class="nav" id="importBtn"><span class="nav-icon">📥</span>Import</button>
        </nav>
    </header>

    <main class="container">
        <section class="card">
            <h2>Find a tool</h2>
            <div class="row" style="align-items:center">
                <input id="q" type="search" placeholder="Search tools (fuzzy + embeddings)…" autofocus style="flex:3" />
                <button class="secondary" id="rescanBtn" style="flex:0 0 auto">Rescan</button>
            </div>
            <div id="results" class="grid" style="margin-top:12px"></div>
        </section>
    </main>

    <footer>Built as a static site · Data stored locally in your browser</footer>

    <script type="module">
        import { Tools, searchTools, toolHref, localOnlyTools } from "./js/app.js";

        // Where the QR Studio tool lives (same URL scheme the tool cards already use for site tools).
        const QR_TOOL_URL = "./tools/qr-tool.html";

        /* ---------- Seed manifest if present ---------- */
        (async () => {
            try {
                const res = await fetch("./tools-manifest.json", { cache: "no-store" });
                if (res.ok) {
                    const manifest = await res.json();
                    const have = new Set(Tools.list().map(t => t.id));
                    for (const t of manifest) {
                        if (!have.has(t.id)) {
                            Tools.add({
                                id: t.id, name: t.name, description: t.description, tags: t.tags,
                                code: "", _manifest: true
                            });
                        }
                    }
                    render(await searchTools(""));
                }
            } catch { }
        })();

        /* ---------- Search ---------- */
        function render(list) {
            const el = document.getElementById("results");
            if (!list.length) {
                el.innerHTML = `<div class="muted">No tools yet. <a href="./add.html">Add one</a>.</div>`;
                return;
            }
            el.innerHTML = list.map(({ doc }) => `
    <a class="card" href="${escape(toolHref(doc))}" style="text-decoration:none;color:inherit">
      <h3 style="margin:0 0 6px">${escape(doc.name)}</h3>
      <div class="muted small">${escape(doc.description || "")}</div>
      <div style="margin-top:8px">${(doc.tags || []).map(t => `<span class="tag">${escape(t)}</span>`).join("")}</div>
    </a>`).join("");
        }
        function escape(s) { return (s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])) }

        let debounce;
        document.getElementById("q").addEventListener("input", e => {
            clearTimeout(debounce);
            debounce = setTimeout(async () => {
                render(await searchTools(e.target.value));
            }, 150);
        });
        render(await searchTools(""));

        /* ---------- Export / Import / Send ---------- */
        const exportBtn = document.getElementById("exportBtn");
        const exportList = document.getElementById("exportList");
        function setMenu(open) {
            exportList.hidden = !open;
            exportBtn.setAttribute("aria-expanded", String(open));
        }
        exportBtn.onclick = (e) => { e.stopPropagation(); setMenu(exportList.hidden); };
        document.addEventListener("click", (e) => { if (!e.target.closest("#exportMenu")) setMenu(false); });
        document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });

        exportList.addEventListener("click", async (e) => {
            const item = e.target.closest("[data-export]");
            if (!item) return;
            setMenu(false);
            // Only local tools that don't already exist on the site are exported.
            const local = await localOnlyTools();
            if (!local.length) { alert("No local tools to export yet."); return; }
            const json = JSON.stringify(local, null, 2);

            if (item.dataset.export === "download") {
                const blob = new Blob([json], { type: "application/json" });
                const a = document.createElement("a");
                a.href = URL.createObjectURL(blob);
                a.download = "local-tools.json";
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            } else {
                // QR: hand the manifest to QR Studio (Communicate tab, send mode) through localStorage.
                try {
                    localStorage.setItem("qrstudio.handoff", JSON.stringify({ ts: Date.now(), name: "local-tools.json", data: json }));
                } catch { alert("Could not hand the tools to QR Studio (storage is full or blocked)."); return; }
                location.href = QR_TOOL_URL;
            }
        });
        document.getElementById("importBtn").onclick = () => {
            const inp = document.createElement("input");
            inp.type = "file"; inp.accept = "application/json";
            inp.onchange = () => {
                const f = inp.files[0]; if (!f) return;
                const r = new FileReader();
                r.onload = () => {
                    try { const n = Tools.importJSON(r.result); alert(`Imported ${n} tools.`); location.reload(); }
                    catch { alert("Invalid JSON"); }
                };
                r.readAsText(f);
            };
            inp.click();
        };
        async function seedFromManifest() {
            try {
                const res = await fetch("./tools-manifest.json?t=" + Date.now(), { cache: "no-store" });
                if (!res.ok) return 0;
                const manifest = await res.json();
                const have = new Set(Tools.list().map(t => t.id));
                let added = 0;
                for (const t of manifest) {
                    if (!have.has(t.id)) {
                        Tools.add({
                            id: t.id, name: t.name, description: t.description, tags: t.tags,
                            code: "", _manifest: true
                        });
                        added++;
                    }
                }
                return added;
            } catch { return 0; }
        }

        await seedFromManifest();

        document.getElementById("rescanBtn").onclick = async () => {
            const btn = document.getElementById("rescanBtn");
            btn.textContent = "Scanning…";
            const n = await seedFromManifest();
            render(await searchTools(document.getElementById("q").value));
            btn.textContent = n ? `Added ${n}` : "Up to date";
            setTimeout(() => { btn.textContent = "Rescan"; }, 1500);
        };
    </script>
</body>

</html>
