<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investing Calculator</title>
  <link rel="icon" href="favicons/favicon.ico" type="image/x-icon">
  <link rel="icon" href="favicons/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="icon" href="favicons/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="favicons/android-chrome-192x192.png" sizes="192x192">
  <link rel="icon" href="favicons/android-chrome-512x512.png" sizes="512x512">
  <link rel="apple-touch-icon" href="favicons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="global.css">
  <script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
</head>
<body>
  <div class="app">

    <!-- Header -->
    <header class="header">
      <h1>💰 Investing Calculator</h1>
      <p>See how your money grows with compound interest over time</p>
    </header>

    <!-- Summary Panel -->
    <div class="card">
      <div class="card-title">Portfolio Summary</div>
      <div class="summary-grid">
        <div class="summary-item total">
          <div class="label">Total Portfolio Value</div>
          <div class="value" id="summary-total">$0</div>
          <div class="sub">after <span id="summary-years">0</span> years</div>
        </div>
        <div class="summary-item contributions">
          <div class="label">Total Contributions</div>
          <div class="value" id="summary-contributions">$0</div>
          <div class="sub">initial + monthly</div>
        </div>
        <div class="summary-item gains">
          <div class="label">Investment Gains</div>
          <div class="value" id="summary-gains">$0</div>
          <div class="sub" id="summary-gains-pct">+0% return</div>
        </div>
      </div>
    </div>

    <!-- Inputs -->
    <div class="card">
      <div class="card-title">Parameters</div>
      <div class="inputs-grid">
        <div class="input-field">
          <label for="initial-investment">Initial Investment</label>
          <div class="input-wrapper has-prefix">
            <span class="input-prefix">$</span>
            <input type="number" id="initial-investment" value="100000" min="0" step="1000">
          </div>
        </div>
        <div class="input-field">
          <label for="monthly-investment">Monthly Contribution</label>
          <div class="input-wrapper has-prefix">
            <span class="input-prefix">$</span>
            <input type="number" id="monthly-investment" value="1000" min="0" step="100">
          </div>
        </div>
        <div class="input-field">
          <label for="return-rate">Annual Return Rate</label>
          <div class="input-wrapper has-suffix">
            <input type="number" id="return-rate" value="7" min="0" max="50" step="0.5">
            <span class="input-suffix">%</span>
          </div>
          <span class="input-hint">S&P 500 historical avg ≈ 7% after inflation</span>
        </div>
        <div class="input-field">
          <label for="year-range">Time Horizon</label>
          <div class="input-wrapper has-suffix">
            <input type="number" id="year-range" value="20" min="1" max="50" step="1">
            <span class="input-suffix">yr</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Graph -->
    <div class="card">
      <div class="card-title">Growth Projection</div>
      <div id="graph"></div>
    </div>

  </div>

  <script type="module" src="index.js"></script>
</body>
</html>
